# Netlify configuration for Vite React application
[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
